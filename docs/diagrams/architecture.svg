<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" width="960" height="600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
        <title id="architecture-title">Zwischenzug system architecture</title>
        <desc id="architecture-desc">Architecture of Zwischenzug: the app renderer reaches the main process only through the preload bridge, the main process holds the session and cooldown engine, Lichess watcher, request lock and native Presage SDK, the Lichess view is isolated behind a trust boundary, and only lichess.org and Presage key checks leave the Mac.</desc>
        <defs>
      <style>#architecture-root { --color-paper:  #0a0a0a;
      --color-ink:    #f2f2f2;
      --color-muted:  #a8a8a8;
      --color-accent: #4cf28c;
      --font-sans:    'Schibsted Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif;
      --font-mono:    'Martian Mono',ui-monospace,SFMono-Regular,Menlo,monospace; }
      #architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-root .subtitle { color: var(--color-muted); font-size: 0.9375rem; line-height: 1.5; max-width: 72ch; margin-bottom: 1.5rem; }
      #architecture-root text { font-family: 'Schibsted Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif; }
      #architecture-root .nm { font-size: 12px; font-weight: 600; fill: #f2f2f2; }
      #architecture-root .hd { font-size: 14px; font-weight: 600; fill: #f2f2f2; }
      #architecture-root .sb { font-family: 'Martian Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 9px; fill: #a8a8a8; }
      #architecture-root .tg { font-family: 'Martian Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 7px; font-weight: 500; letter-spacing: 0.08em; }
      #architecture-root .al { font-family: 'Martian Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 8px; letter-spacing: 0.06em; }
      #architecture-root .zl { font-family: 'Martian Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 7px; font-weight: 500; letter-spacing: 0.14em; }
      #architecture-root .lg { font-size: 9px; fill: #a8a8a8; }
      #architecture-root .lgh { font-family: 'Martian Mono',ui-monospace,SFMono-Regular,Menlo,monospace; font-size: 8px; letter-spacing: 0.18em; fill: #a8a8a8; }
      @media print {
#architecture-root .diagram-container { overflow-x: visible; }
}</style>
