        <rect x="40" y="320" width="216" height="128" rx="8" fill="#c9ad74" stroke="#c9ad74" stroke-width="0.8" stroke-dasharray="4,4" fill-opacity="0.04"/><rect x="48" y="324" width="144" height="12" rx="2" fill="#0a0a0a"/><text class="zl" x="52" y="333" fill="#c9ad74">LICHESS VIEW · ISOLATED</text>
