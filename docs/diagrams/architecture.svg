        <text class="tg" x="74" y="95" fill="#a8a8a8" text-anchor="middle">UI</text>
        <text class="nm" x="68" y="116" text-anchor="start">App renderer</text>
        <text class="sb" x="68" y="131" text-anchor="start">screens + PresageProvider</text>
        <text class="sb" x="68" y="144" text-anchor="start">camera: getUserMedia</text>
