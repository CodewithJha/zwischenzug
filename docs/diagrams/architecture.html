    <h1>Zwischenzug system architecture</h1>
    <p class="subtitle">One Electron window, three processes. The main process owns state, the cooldown engine and the lock; the sandboxed app renderer runs the UI and camera; Lichess runs in an isolated view with no preload and no permissions.</p>
